name: build-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --noupx --clean --name hzau-autologin --exclude-module tkinter srun_login.py

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "hzau-autologin-${{ github.ref_name }}-win64.zip"
          $staging = Join-Path $env:RUNNER_TEMP 'staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item dist/hzau-autologin.exe $staging/
          Copy-Item installer/* $staging/
          Copy-Item README.md $staging/
          Copy-Item TUTORIAL.md $staging/
          Copy-Item config.example.json $staging/
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "SHA256=$hash" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hzau-autologin-*.zip
            hzau-autologin-*.zip.sha256
            dist/hzau-autologin.exe
          generate_release_notes: true
          body: |
            ## 安装

            1. 下载 `hzau-autologin-${{ github.ref_name }}-win64.zip` 并解压到任意位置
            2. 双击 `install.bat`，按提示输入学号和校园网密码
            3. 完成。以后开机联网自动认证，无需 Python 环境

            > Windows SmartScreen 若提示"未知发布者"，点 **更多信息 → 仍要运行**（未签名的自编译程序都会有此提示）。

            **SHA256**: `${{ env.SHA256 }}`
